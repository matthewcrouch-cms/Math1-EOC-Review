<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EOC Review · Teacher View</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body{font-size:15px}
  main{max-width:1240px}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  nav button{background:transparent;border:none;color:#fff;padding:7px 11px;border-radius:8px;font-weight:700;opacity:.88}
  nav button.on{background:#fff;color:var(--blue-dk);opacity:1}
  .hbtn{background:var(--orange);color:#fff;border:none;border-radius:8px;padding:7px 12px;font-weight:700}
  h1{font-size:1.35rem} h2{font-size:1.1rem;margin:0 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .btn{background:var(--blue-dk);color:#fff;border:none;border-radius:9px;padding:8px 16px;font-weight:700}
  .btn.alt{background:#fff;color:var(--blue-dk);border:1.5px solid var(--blue)}
  .btn.warn{background:#fff;color:var(--bad);border:1.5px solid #E7A3A3}
  .btn.sm{padding:4px 10px;font-size:.85rem}
  .btn:disabled{opacity:.5;cursor:default}
  input[type=password],input[type=text],input[type=email],input[type=number],input[type=date],input[type=datetime-local],select,textarea{border:1.5px solid #AFC2D1;border-radius:8px;padding:7px 10px;background:#fff}
  input[type=number]{width:80px}
  .login{max-width:380px;margin:60px auto;text-align:center}
  .login input{width:100%;margin:8px 0}
  .scroll{overflow-x:auto}
  table.t{border-collapse:collapse;width:100%;background:#fff}
  table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
  table.t th{background:#F0F5F9;font-size:.8rem;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);position:sticky;top:0}
  table.t td.c,table.t th.c{text-align:center}
  .cell{border:1px solid transparent;border-radius:8px;padding:5px 8px;min-width:74px;background:none;text-align:center;width:100%}
  .cell:hover{border-color:var(--blue);background:var(--blue-lt)}
  .cell b{display:block;font-size:1.02rem} .cell small{color:var(--muted);font-size:.75rem}
  .s-hi b{color:var(--good)} .s-mid b{color:#B36B00} .s-lo b{color:var(--bad)} .s-none b{color:#A9B6C2}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--orange-lt);color:#B34A00;margin-left:4px}
  .tag.ext{background:#F1ECFA;color:#5B3A99} .tag.off{background:#EEF1F4;color:var(--muted)}
  .pin{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:2px;font-size:1.05rem}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .mutedtxt{color:var(--muted);font-size:.88rem}
  .meter{height:8px;background:var(--line);border-radius:9px;overflow:hidden;min-width:90px}
  .meter i{display:block;height:100%}
  .overlay{position:fixed;inset:0;background:rgba(15,30,45,.45);display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;z-index:20;overflow-y:auto}
  .modal{background:#fff;border-radius:16px;max-width:820px;width:100%;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .modal h2{display:flex;justify-content:space-between;gap:10px}
  .x{background:none;border:none;font-size:1.4rem;line-height:1;color:var(--muted)}
  .good{color:var(--good);font-weight:700} .bad{color:var(--bad);font-weight:700}
  textarea{width:100%;min-height:140px}
  .slips{display:none}
  .keyans{margin:10px 0 0;background:var(--good-lt);border-radius:10px;padding:10px 14px;color:#145C29}
  .keyhint{margin:6px 0 0;background:#F4F9FD;border-left:4px solid var(--blue);border-radius:6px;padding:7px 12px;font-size:.93rem}
  .prob.off{opacity:.55}
  .switch{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;cursor:pointer;user-select:none}
  .switch input{width:40px;height:22px;appearance:none;background:#C9D4DD;border-radius:99px;position:relative;cursor:pointer;transition:.15s}
  .switch input:checked{background:var(--good)}
  .switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.15s}
  .switch input:checked::after{left:21px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .grid2 label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
  .grid2 label small{font-weight:500;color:var(--muted)}
  @media print{
    body *{visibility:hidden} .slips,.slips *{visibility:visible}
    .slips{display:grid!important;position:absolute;left:0;top:0;width:100%;grid-template-columns:1fr 1fr;gap:0}
    .slip{border:1px dashed #999;padding:14px 16px;break-inside:avoid;font-size:14px}
    .slip b{font-size:16px} .slip .pin{font-size:22px}
  }
</style>
</head>
<body>
<header>
  <div class="brand">BR: Math 1 <small>EOC Review · Teacher</small></div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<div class="slips" id="slips"></div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/review-data.js"></script>
<script>
const { esc, r1, fmtDT, rpc } = EOC;
const app = document.getElementById("app"), nav = document.getElementById("nav");
const ss = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
             set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
             del(k) { try { sessionStorage.removeItem(k); } catch (e) {} } };
const S = { tok: ss.get("eoc_ttok"), data: null, tab: "grades", cls: ss.get("eoc_tcls") || "all", insightA: null, bank: null, keySet: "all" };

// ---------------- LOGIN ----------------
function showLogin(msg) {
  nav.innerHTML = "";
  app.innerHTML = `<div class="card login"><h1>Teacher login</h1>
    <input type="email" id="em" placeholder="School email" autocomplete="username" autofocus>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="go" style="width:100%;margin-top:6px">Log in</button>
    <div id="lerr">${msg ? `<div class="err">${esc(msg)}</div>` : ""}</div>
    <p class="mutedtxt" style="margin-top:14px">No account yet? Ask the platform admin to add you.</p></div>`;
  const go = async () => {
    try { const r = await rpc("t_login", { p_email: document.getElementById("em").value, p_password: document.getElementById("pw").value });
          S.tok = r.token; ss.set("eoc_ttok", r.token); refresh(); }
    catch (e) { document.getElementById("lerr").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
  document.getElementById("go").onclick = go;
  document.getElementById("pw").onkeydown = e => { if (e.key === "Enter") go(); };
}
async function refresh() {
  try { S.data = await rpc("t_data", { p_token: S.tok }); }
  catch (e) { ss.del("eoc_ttok"); return showLogin(e.expired ? "Please log in again." : e.message); }
  render();
}
async function call(fn, args, okMsg) {
  try { const r = await rpc(fn, { p_token: S.tok, ...args }); if (okMsg) toast(okMsg, true); return r; }
  catch (e) { if (e.expired) { ss.del("eoc_ttok"); showLogin("Please log in again."); } else toast(e.message); throw e; }
}
function toast(msg, good) {
  const d = document.createElement("div"); d.className = good ? "ok" : "err"; d.textContent = msg;
  d.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);top:14px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.15)";
  document.body.appendChild(d); setTimeout(() => d.remove(), 4000);
}

// ---------------- DATA HELPERS ----------------
const D = () => S.data;
function stateMap() { const m = {}; for (const s of D().states) m[s.s + "|" + s.p] = s; return m; }
const extFor = (sid, aid) => D().extensions.find(e => e.s === sid && e.a === aid);
const className = id => (D().classes.find(c => c.id === id) || {}).name || "—";
const setTitle = id => (D().sets.find(s => s.id === id) || {}).title || "";
function summary(student, a, sm) {
  let score = 0, late = 0, started = 0; const probs = {};
  for (const p of a.parts) {
    const st = sm[student.id + "|" + p.id];
    probs[p.problem] = (probs[p.problem] ?? true) && !!(st && st.done);
    if (st) { started++; score += p.points * st.pct / 100; if (st.late) late = Math.max(late, st.late); }
  }
  const vals = Object.values(probs);
  return { score: r1(score), done: vals.filter(Boolean).length, total: vals.length, late, started };
}
const students = (all) => D().students.filter(s => (all || s.active) && (S.cls === "all" || s.class_id === +S.cls));
function classPicker(id = "cf", withAll = true) {
  return `<select id="${id}">${withAll ? `<option value="all">All classes</option>` : ""}${D().classes.filter(c => c.active).map(c => `<option value="${c.id}" ${String(S.cls) === String(c.id) ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>`;
}
function wireClassPicker(rerender) {
  const el = document.getElementById("cf");
  if (el) el.onchange = () => { S.cls = el.value; ss.set("eoc_tcls", S.cls); rerender(); };
}
const qLabel = p => `${setTitle(p.set)} #${p.n}${p.label || ""}`;

// ---------------- LAYOUT ----------------
function render() {
  const tabs = [["grades", "Gradebook"], ["insights", "Insights"], ["roster", "Classes & PINs"], ["schedule", "Due dates"], ["export", "Export to Canvas"], ["key", "Answer key"]];
  if (D().me.is_admin) tabs.push(["admin", "Admin"]);
  tabs.push(["account", "👤 " + D().me.name.split(" ")[0]]);
  nav.innerHTML = tabs.map(([k, l]) => `<button class="${S.tab === k ? "on" : ""}" data-t="${k}">${esc(l)}</button>`).join("") + `<button class="hbtn" id="preview">👁 Preview as student</button>`;
  nav.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { S.tab = b.dataset.t; render(); });
  document.getElementById("preview").onclick = preview;
  ({ grades: renderGrades, insights: renderInsights, roster: renderRoster, schedule: renderSchedule, export: renderExport,
     key: renderKey, admin: renderAdmin, account: renderAccount })[S.tab]();
}
async function preview() {
  const r = await call("t_preview", { p_reset: false });
  try { localStorage.setItem("eoc_token", r.token); } catch (e) {}
  window.open("index.html", "_blank");
}

// ---------------- GRADEBOOK ----------------
function renderGrades() {
  const as = D().assignments, st = students(), sm = stateMap();
  if (!D().classes.length) { app.innerHTML = `<div class="card"><h2>Welcome, ${esc(D().me.name)}!</h2><p>Start on the <b>Classes & PINs</b> tab: add your classes (like “Block 2”), then paste in your rosters. Then check the <b>Due dates</b> tab.</p></div>`; return; }
  app.innerHTML = `
    <div class="row" style="justify-content:space-between"><div><h1>Gradebook</h1>
      <p class="sub">Scores are out of 100 and update live. Click a score for question-by-question detail, an extension, or to reset work.</p></div>
      <div class="row">${classPicker()}<button class="btn alt" id="rf">↻ Refresh</button></div></div>
    ${st.length ? `<div class="card scroll" style="padding:0"><table class="t">
      <tr><th>Student</th>${S.cls === "all" ? "<th>Class</th>" : ""}${as.map(a => `<th class="c" title="${esc(a.title)}">${esc(a.title)}<br><span style="text-transform:none;font-weight:500">due ${fmtDT(a.due)}</span></th>`).join("")}<th class="c">Average</th></tr>
      ${st.map(s => { let tot = 0, n = 0; const cells = as.map(a => {
          const x = summary(s, a, sm), ext = extFor(s.id, a.id);
          if (a.due && new Date(a.due) < new Date()) { tot += x.score; n++; }
          const cls = !x.started ? "s-none" : x.score >= 80 ? "s-hi" : x.score >= 60 ? "s-mid" : "s-lo";
          return `<td class="c"><button class="cell ${cls}" data-s="${s.id}" data-a="${a.id}"><b>${x.started ? x.score : "—"}</b><small>${x.done}/${x.total} done</small>
            ${x.late ? `<span class="tag">late</span>` : ""}${ext ? `<span class="tag ext">ext</span>` : ""}</button></td>`; }).join("");
        return `<tr><td><b>${esc(s.last)}</b>, ${esc(s.first)}</td>${S.cls === "all" ? `<td class="mutedtxt">${esc(className(s.class_id))}</td>` : ""}${cells}
          <td class="c" title="Average of nights already due"><b>${n ? r1(tot / n) : "—"}</b></td></tr>`; }).join("")}
    </table></div>` : `<div class="card">No students in this class yet. Add them on the <b>Classes & PINs</b> tab.</div>`}`;
  document.getElementById("rf").onclick = refresh;
  wireClassPicker(renderGrades);
  app.querySelectorAll(".cell").forEach(b => b.onclick = () => detail(+b.dataset.s, b.dataset.a));
}
const toLocalInput = iso => { if (!iso) return ""; const d = new Date(iso), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };

function detail(sid, aid) {
  const s = D().students.find(x => x.id === sid), a = D().assignments.find(x => x.id === aid), sm = stateMap();
  const ext = extFor(sid, aid), x = summary(s, a, sm);
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="modal">
    <h2><span>${esc(s.first)} ${esc(s.last)} · ${esc(a.title)}</span><button class="x" id="cl">×</button></h2>
    <p class="sub">Score: <b>${x.score}</b> / 100 · ${x.done} of ${x.total} questions finished</p>
    <div class="scroll"><table class="t"><tr><th>Question</th><th>Topic</th><th>Result</th><th class="c">Wrong tries</th><th class="c">Hint</th><th class="c">Late days</th><th class="c">Points</th><th>Finished</th></tr>
    ${a.parts.map(p => { const st = sm[sid + "|" + p.id];
      const res = !st ? `<span class="mutedtxt">not started</span>` : st.done ? (st.correct ? `<span class="good">✓ correct</span>` : `<span class="bad">✗ out of tries</span>`) : `<span class="mutedtxt">in progress</span>`;
      return `<tr><td>${esc(qLabel(p))}</td><td class="mutedtxt">${esc(EOC.topicName(p.topic))}</td><td>${res}</td><td class="c">${st ? st.wrong : ""}</td>
        <td class="c">${st && st.hint ? "Hint " + st.hint : ""}</td><td class="c">${st && st.late ? st.late : ""}</td>
        <td class="c">${st ? r1(p.points * st.pct / 100) : 0} / ${r1(p.points)}</td><td class="mutedtxt">${st && st.at ? fmtDT(st.at) : ""}</td></tr>`; }).join("")}
    </table></div>
    <div class="card" style="margin-top:16px;background:#FAFCFE">
      <h2>Extension</h2>
      <p class="mutedtxt" style="margin-top:-6px">Your due date: ${fmtDT(a.due)} · closes ${fmtDT(a.closes)}. An extension moves both for this student only, and late penalties are recalculated.</p>
      <div class="row"><label>New due <input type="datetime-local" id="ed" value="${toLocalInput(ext ? ext.due : a.due)}"></label>
        <label>Closes <input type="datetime-local" id="ec" value="${toLocalInput(ext ? ext.closes : a.closes)}"></label>
        <button class="btn" id="es">Save extension</button>${ext ? `<button class="btn alt" id="er">Remove extension</button>` : ""}</div>
    </div>
    <div class="row" style="justify-content:space-between"><span class="mutedtxt">Reset clears this student's answers, hints, and score on this night so they can start over.</span>
      <span id="rs"><button class="btn warn" id="rw">Reset work…</button></span></div>
  </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector("#cl").onclick = close; ov.onclick = e => { if (e.target === ov) close(); };
  ov.querySelector("#es").onclick = async () => {
    const d = ov.querySelector("#ed").value, c = ov.querySelector("#ec").value; if (!d) return toast("Pick a due date.");
    await call("t_extension", { p_student: sid, p_assignment: aid, p_due: new Date(d).toISOString(), p_closes: new Date(c || d).toISOString() }, "Extension saved.");
    close(); refresh();
  };
  const er = ov.querySelector("#er");
  if (er) er.onclick = async () => { await call("t_extension", { p_student: sid, p_assignment: aid, p_due: null, p_closes: null }, "Extension removed."); close(); refresh(); };
  ov.querySelector("#rw").onclick = () => {
    ov.querySelector("#rs").innerHTML = `<b class="bad">Erase all of ${esc(s.first)}'s work on ${esc(a.title)}?</b> <button class="btn warn" id="ry">Yes, reset</button> <button class="btn alt" id="rn">Cancel</button>`;
    ov.querySelector("#rn").onclick = () => { close(); detail(sid, aid); };
    ov.querySelector("#ry").onclick = async () => { await call("t_reset_work", { p_student: sid, p_assignment: aid }, "Work reset."); close(); refresh(); };
  };
}

// ---------------- INSIGHTS ----------------
function renderInsights() {
  const as = D().assignments; if (!as.length) { app.innerHTML = `<div class="card">No assignments yet.</div>`; return; }
  if (!S.insightA || !as.find(a => a.id === S.insightA)) S.insightA = as[0].id;
  const a = as.find(x => x.id === S.insightA), ids = new Set(students().map(s => s.id));
  const rows = a.parts.map(p => {
    const sts = D().states.filter(s => s.p === p.id && ids.has(s.s));
    const done = sts.filter(s => s.done), correct = done.filter(s => s.correct);
    const first = correct.filter(s => s.wrong === 0 && s.hint === 0).length, hinted = sts.filter(s => s.hint > 0);
    const avgWrong = sts.length ? sts.reduce((t, s) => t + s.wrong, 0) / sts.length : 0, out = done.length - correct.length;
    const struggle = sts.length ? (hinted.length + sts.filter(s => s.wrong >= 2).length + out * 2) / sts.length : 0;
    return { p, n: sts.length, first, hinted: hinted.length, t: [1, 2, 3].map(k => sts.filter(s => s.hint === k).length), avgWrong, out, struggle };
  });
  const maxS = Math.max(0.0001, ...rows.map(r => r.struggle));
  // topic mastery across every night
  const topics = {};
  for (const n of as) for (const p of n.parts) {
    const t = topics[p.topic] ||= { n: 0, first: 0, pct: 0 };
    for (const s of D().states) if (s.p === p.id && ids.has(s.s) && s.done) { t.n++; t.pct += s.pct; if (s.correct && !s.wrong && !s.hint) t.first++; }
  }
  const trows = Object.entries(topics).filter(([, t]) => t.n).sort((x, y) => x[1].pct / x[1].n - y[1].pct / y[1].n);
  app.innerHTML = `
    <div class="row" style="justify-content:space-between"><div><h1>Insights</h1><p class="sub">What needs reteaching before the EOC?</p></div>
      <div class="row">${classPicker()}<button class="btn alt" id="rf">↻ Refresh</button></div></div>
    <div class="card"><h2>Topic mastery (all nights)</h2>
      ${trows.length ? `<table class="t"><tr><th>Topic</th><th class="c">Answers finished</th><th class="c">Right first try</th><th>Average score</th></tr>
        ${trows.map(([id, t]) => { const avg = t.pct / t.n; return `<tr><td><b>${esc(EOC.topicName(id))}</b></td><td class="c">${t.n}</td><td class="c">${Math.round(100 * t.first / t.n)}%</td>
          <td><div class="row"><div class="meter" style="flex:1"><i style="width:${avg}%;background:${avg < 60 ? "var(--bad)" : avg < 80 ? "var(--orange)" : "var(--good)"}"></i></div><b style="min-width:42px">${Math.round(avg)}%</b></div></td></tr>`; }).join("")}</table>
        <p class="mutedtxt">Weakest topics are listed first. Based on finished questions only.</p>` : `<p class="mutedtxt">No finished work yet.</p>`}
    </div>
    <div class="card scroll"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">Question by question</h2>
      <select id="as">${as.map(x => `<option value="${x.id}" ${x.id === a.id ? "selected" : ""}>${esc(x.title)}</option>`).join("")}</select></div>
      <table class="t"><tr><th>Question</th><th>Topic</th><th class="c">Started</th><th class="c">Right first try</th><th class="c">Avg wrong tries</th><th class="c">Used a hint</th><th class="c">Deepest hint<br><span style="text-transform:none;font-weight:500">1 · 2 · 3</span></th><th class="c">Out of tries</th><th>Struggle level</th></tr>
      ${rows.map(r => `<tr><td><b>${esc(qLabel(r.p))}</b></td><td class="mutedtxt">${esc(EOC.topicName(r.p.topic))}</td><td class="c">${r.n}</td>
        <td class="c">${r.n ? Math.round(100 * r.first / r.n) + "%" : "—"}</td><td class="c">${r.n ? r.avgWrong.toFixed(1) : "—"}</td><td class="c">${r.hinted}</td>
        <td class="c">${r.t.join(" · ")}</td><td class="c">${r.out ? `<span class="bad">${r.out}</span>` : 0}</td>
        <td><div class="meter"><i style="width:${100 * r.struggle / maxS}%;background:${r.struggle / maxS > .66 ? "var(--bad)" : r.struggle / maxS > .33 ? "var(--orange)" : "var(--blue)"}"></i></div></td></tr>`).join("")}
      </table><p class="mutedtxt">Struggle level combines hint use, repeated wrong tries, and running out of tries, relative to the other questions that night.</p></div>`;
  document.getElementById("as").onchange = e => { S.insightA = e.target.value; renderInsights(); };
  document.getElementById("rf").onclick = refresh;
  wireClassPicker(renderInsights);
}

// ---------------- CLASSES & PINS ----------------
function parseNames(text) {
  // Accepts "Last, First", "First Last", or rows copied from a spreadsheet or another site's table.
  // An optional 4-digit PIN can come after the name: same line, or (when a copied table puts each cell on its own line) the lines below it.
  const pinOf = cells => { const p = cells.find(c => /^\d{4}$/.test(c)) || cells.find(c => /^\d{1,3}$/.test(c)); return p ? p.padStart(4, "0") : ""; };
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l && !/^(name|last\s*name)\b/i.test(l));
  const isComma = l => /^[^,\t\d]+,\s*[^,\t\d]+/.test(l);
  if (lines.some(isComma)) {
    // "Last, First" records; anything that isn't a name line belongs to the record above it
    const out = [];
    for (const l of lines) {
      const c = l.split("\t").map(x => x.trim());
      if (isComma(c[0])) {
        const [last, first] = c[0].split(",").map(x => x.trim());
        out.push({ last, first, rest: c.slice(1).concat(c[0].split(",").slice(2).map(x => x.trim())) });
      } else if (out.length) out[out.length - 1].rest.push(...c);
    }
    return out.map(r => ({ first: r.first, last: r.last, pin: pinOf(r.rest) })).filter(n => n.first && n.last);
  }
  return lines.map(l => {
    let first = "", last = "", rest = [];
    if (l.includes("\t")) { const c = l.split("\t").map(x => x.trim()); last = c[0]; first = c[1] || ""; rest = c.slice(2); }
    else { const w = l.split(/\s+/); if (/^\d{1,4}$/.test(w[w.length - 1])) rest = [w.pop()]; last = w.pop() || ""; first = w.join(" "); }
    return { first, last, pin: pinOf(rest) };
  }).filter(n => n.first && n.last && !/\d/.test(n.first + n.last));
}

function nextSchoolDay(d, off) { const x = new Date(d); do { x.setDate(x.getDate() + 1); } while (x.getDay() === 0 || x.getDay() === 6 || off.has(ymd(x))); return x; }
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function scheduleEditor(rows, saveFn, note) {
  const off = new Set(D().no_school.map(n => n.day));
  app.querySelector("#sched").innerHTML = `
    <div class="card" style="background:#FAFCFE"><h2>Quick fill</h2>

        <label>Everything closes <input type="datetime-local" id="qc"></label><button class="btn alt" id="qf">Fill in the table</button></div>

    <table class="t"><tr><th>Night</th><th>Sets</th><th>Opens</th><th>Due</th><th>Closes</th></tr>
      ${rows.map(a => `<tr data-a="${a.id}"><td><b>${esc(a.title)}</b></td><td class="mutedtxt">${a.set_ids.map(id => `${setTitle(id)} ${D().sets.find(s => s.id === id).calc ? "" : "(no calc)"}`).join(" + ")}</td>

        <td><input type="datetime-local" data-k="closes" value="${toLocalInput(a.closes)}"></td></tr>`).join("")}</table>
    <div class="row" style="margin-top:12px"><button class="btn" id="sv">Save</button><span class="mutedtxt">${note || ""}</span></div>`;
  const q = s => app.querySelector(s);
  const first = rows[0] && rows[0].opens ? new Date(rows[0].opens) : null;
  if (first) q("#qs").value = ymd(first);
  if (rows[0] && rows[0].closes) q("#qc").value = toLocalInput(rows[rows.length - 1].closes);
  q("#qf").onclick = () => {

  };
}

function csvParse(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c; }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
const csvCell = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
function download(name, rows) { const blob = new Blob([rows.map(r => r.map(csvCell).join(",")).join("\r\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); }
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim();
const shortTitle = a => "EOC Review " + a.title.replace(/^Night /, "Night ");

        const name = r[0] || "";

        if (/^student, test$/i.test(name.trim())) continue;
        const [cl, cf = ""] = name.split(",").map(norm);

               || studs.find(s => norm(s.last) === cl && studs.filter(x => norm(x.last) === cl).length === 1);

        matched.add(s.id); out.push([...r.slice(0, idEnd + 1), ...maps.map(m => summary(s, m.a, sm).score)]);

        ${here.length ? `<div class="err">On this platform but not in the Canvas file: ${here.map(s => esc(s.first + " " + s.last)).join("; ")}</div>` : ""}`;
    };
  };
}

      <div class="row"><input type="text" id="tn" placeholder="Name (students see this)"><input type="email" id="te" placeholder="School email"><input type="text" id="tp" placeholder="Starting password (8+ characters)">
        <button class="btn" id="tadd">Add teacher</button></div>
      <p class="mutedtxt">Send them the teacher link and their starting password; they can change it under their name in the menu.</p></div>
    <div class="card"><h2>Scoring rules ${sc.draft ? `<span class="tag">draft</span>` : ""}</h2>
      <p class="mutedtxt" style="margin-top:-6px">Changes apply right away to every teacher's gradebook, including work already finished.</p>
      <div class="grid2">
        <label>Tries per question<input type="number" id="s_ma" min="1" max="10" value="${sc.max_attempts}"></label>
        <label>% off per wrong try<input type="number" id="s_wp" min="0" max="50" value="${sc.wrong_pct}"></label>
        <label>Hint costs (%)<input type="text" id="s_hc" value="${sc.hint_costs.join(", ")}"><small>Comma-separated. Most questions have 2 hints.</small></label>
        <label>Lowest score for a correct answer (%)<input type="number" id="s_fl" min="0" max="100" value="${sc.floor_pct}"></label>
        <label>% off per school day late<input type="number" id="s_lp" min="0" max="50" value="${sc.late_pct_per_day}"></label>
        <label style="flex-direction:row;align-items:center;gap:8px;margin-top:22px"><input type="checkbox" id="s_dr" ${sc.draft ? "checked" : ""}> Show “draft rules” to students</label></div>
      <button class="btn" id="ssave" style="margin-top:12px">Save scoring rules</button></div>
    <div class="card scroll"><h2>Department default due dates</h2>
      <p class="mutedtxt" style="margin-top:-6px">New teachers start with these dates. Changing them here doesn't change dates a teacher already has.</p><div id="sched"></div></div>
    <div class="card"><h2>No-school days</h2>
      <div class="row" style="margin-bottom:10px">${D().no_school.map(n => `<span class="chip closed" style="font-size:.88rem;padding:4px 10px">${n.day}${n.note ? " · " + esc(n.note) : ""} <a href="#" data-rm="${n.day}">✕</a></span>`).join("") || `<span class="mutedtxt">None yet.</span>`}</div>
      <div class="row"><input type="date" id="nd"><input type="text" id="nn" placeholder="Note (optional)"><button class="btn alt" id="nadd">Add day</button></div></div>`;
  app.querySelectorAll("[data-pw]").forEach(b => b.onclick = async () => { const p = prompt("New password for this teacher (8+ characters):"); if (p) await call("a_teacher", { p_action: "reset_password", p_teacher: +b.dataset.pw, p_name: null, p_email: null, p_password: p }, "Password reset."); });
  app.querySelectorAll("[data-ta]").forEach(b => b.onclick = async () => { await call("a_teacher", { p_action: b.dataset.ta, p_teacher: +b.dataset.id, p_name: null, p_email: null, p_password: null }); renderAdmin(); });
  document.getElementById("tadd").onclick = async () => {
    await call("a_teacher", { p_action: "add", p_teacher: null, p_name: document.getElementById("tn").value, p_email: document.getElementById("te").value, p_password: document.getElementById("tp").value }, "Teacher added.");
    renderAdmin();
  };
  document.getElementById("ssave").onclick = async () => {
    const v = id => Number(document.getElementById(id).value);
    const hc = document.getElementById("s_hc").value.split(/[,\s]+/).filter(Boolean).map(Number);
    if (hc.some(isNaN)) return toast("Hint costs should be numbers, like 5, 10, 20.");
    await call("a_set_scoring", { p_scoring: { max_attempts: v("s_ma"), wrong_pct: v("s_wp"), hint_costs: hc, floor_pct: v("s_fl"), late_pct_per_day: v("s_lp"), draft: document.getElementById("s_dr").checked } }, "Scoring rules saved.");
    refresh();
  };
  scheduleEditor(D().assignments.map(a => ({ ...a, ...a.default })), rows => call("a_defaults", { p_rows: rows }, "Default dates saved."));
  document.getElementById("nadd").onclick = async () => { const d = document.getElementById("nd").value; if (!d) return;
    await call("a_no_school", { p_day: d, p_note: document.getElementById("nn").value, p_remove: false }); await refresh(); S.tab = "admin"; renderAdmin(); };
  app.querySelectorAll("[data-rm]").forEach(a => a.onclick = async e => { e.preventDefault();
    await call("a_no_school", { p_day: a.dataset.rm, p_note: null, p_remove: true }); await refresh(); renderAdmin(); });
}

// ---------------- ACCOUNT ----------------
function renderAccount() {
  app.innerHTML = `<div class="card" style="max-width:460px"><h1>${esc(D().me.name)}</h1><p class="sub">${esc(D().me.email)}</p>
    <h2>Change password</h2>
    <input type="password" id="po" placeholder="Current password" style="width:100%;margin:4px 0">
    <input type="password" id="pn" placeholder="New password (8+ characters)" style="width:100%;margin:4px 0">
    <div class="row" style="margin-top:8px"><button class="btn" id="pc">Change password</button><button class="btn alt" id="lo">Log out</button></div></div>`;
  document.getElementById("pc").onclick = () => call("t_change_password", { p_old: document.getElementById("po").value, p_new: document.getElementById("pn").value }, "Password changed.");
  document.getElementById("lo").onclick = () => { rpc("t_logout", { p_token: S.tok }).catch(() => {}); ss.del("eoc_ttok"); S.tok = null; showLogin(); };
}

S.tok ? refresh() : showLogin();
</script>
</body>
</html>
